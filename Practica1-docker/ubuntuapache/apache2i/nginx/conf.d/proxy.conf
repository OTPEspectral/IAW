# Configuración de Rate Limiting (Fase 2 de la Práctica)
# 4 req/s sostenidas con burst de 6 para picos de recarga
limit_req_zone $binary_remote_addr zone=nimbus_limit:10m rate=1r/s;
limit_req_status 429;

# 1. Redirección HTTP (Puerto 80) -> HTTPS (301 Moved Permanently)
server {
    listen 80;
    server_name home.otp.corp public.otp.corp private.otp.corp;

    return 301 https://$host$request_uri;
}

# 2. Servidor HTTPS (Puerto 443) -> Proxy Inverso a Apache
server {
    listen 443 ssl;
    http2 on;
    server_name home.otp.corp public.otp.corp private.otp.corp;

    # Certificados TLS (ECDSA)
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Restricción de protocolos
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Cabeceras de Seguridad Perimetrales
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        # Rate Limiting
        limit_req zone=nimbus_limit burst=1 nodelay;

        # Reenvío a Apache (contenedor backend)
        proxy_pass http://servidor_apache:80;

        # Cabeceras X-Forwarded-* obligatorias
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
