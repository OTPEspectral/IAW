<VirtualHost *:80>
    ServerName home.otp.corp
    ServerAlias *.otp.corp
    DocumentRoot /var/www/home

    ErrorLog /var/log/apache2/home_error.log
    CustomLog /var/log/apache2/home_access.log combined

    <Directory /var/www/home>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
