<VirtualHost *:80>
    ServerName private.otp.corp
    DocumentRoot /var/www/private

    ErrorLog /var/log/apache2/private_error.log
    CustomLog /var/log/apache2/private_access.log combined

    <Directory /var/www/private>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Protección de recurso sensible interno
    <Files "db-credentials.php">
        Require all denied
    </Files>
</VirtualHost>
